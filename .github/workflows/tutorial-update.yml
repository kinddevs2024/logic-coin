name: Publishable tutorial update
on:
  workflow_dispatch:
  push:
    branches: [codex/home-tutorial-update]
    paths: [.github/workflows/tutorial-update.yml]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      LOGIC_UPDATE_CHANNEL: preview
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
      EXPO_PUBLIC_APPODEAL_APP_KEY: ${{ secrets.EXPO_PUBLIC_APPODEAL_APP_KEY }}
      EXPO_PUBLIC_APPODEAL_TEST_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.18.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            frontend/app.json
            frontend/plugins/**
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: logic-coin-android-release
          run-id: 38785543129
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-apk
      - run: npm ci --workspace frontend --include=dev
      - run: npm run lint --workspace frontend && npm run typecheck --workspace frontend && npm test --workspace frontend
      - name: Generate matching native configuration
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install
      - name: Reproduce Gradle plugin configuration from the APK build
        working-directory: frontend/android
        run: chmod +x ./gradlew && ./gradlew help --no-daemon
      - run: node scripts/ota/prepare-native-fingerprint.mjs
      - name: Verify compatibility with the actual APK
        run: node scripts/ota/verify-apk-target.mjs previous-apk/logic-coin.apk be1e5502be784e2f4e398a159851eeb780a9de8a artifacts/compatibility
      - name: Export Android update
        run: node scripts/ota/prepare-export.mjs preview
      - uses: actions/upload-artifact@v4
        with:
          name: logic-coin-tutorial-update
          path: |
            frontend/dist-ota-preview
            artifacts/compatibility
          retention-days: 14
