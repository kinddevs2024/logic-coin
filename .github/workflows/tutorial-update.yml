name: Publishable tutorial update
on:
  workflow_dispatch:
  push:
    branches: [codex/home-tutorial-update]
    paths: [.github/workflows/tutorial-update.yml]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: production
      LOGIC_UPDATE_CHANNEL: preview
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
      EXPO_PUBLIC_APPODEAL_APP_KEY: ${{ secrets.EXPO_PUBLIC_APPODEAL_APP_KEY }}
      EXPO_PUBLIC_APPODEAL_TEST_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.18.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            frontend/app.json
            frontend/plugins/**
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        with:
          name: logic-coin-android-release
          run-id: 38785543129
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-apk
      - run: npm ci --workspace frontend --include=dev
      - run: npm run lint --workspace frontend && npm run typecheck --workspace frontend && npm test --workspace frontend
      - name: Generate matching native configuration
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install
      - run: node scripts/ota/prepare-native-fingerprint.mjs
      - name: Load fingerprint from the authenticated original build log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run view 38785543129 --repo kinddevs2024/logic-coin --log > "$RUNNER_TEMP/baseline.log"
          node -e 'const fs=require("fs");const line=fs.readFileSync(process.env.RUNNER_TEMP+"/baseline.log","utf8").split("\n").find(s=>s.includes("{\"sources\"") && s.includes("e8acc8045d2ed90a518eb58b74373d71f8c200c5")); if(!line)throw Error("Baseline fingerprint not found");fs.writeFileSync(process.env.RUNNER_TEMP+"/baseline-fingerprint.json",line.slice(line.indexOf("{\"sources\"")));'
      - name: Verify pinned registry plugin sources
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          cd "$RUNNER_TEMP/registry"
          npm pack expo-updates@57.0.24 --ignore-scripts > package-name.txt
          tar -xf "$(cat package-name.txt)"
      - name: Verify compatibility with the actual APK
        env:
          OTA_BASELINE_FINGERPRINT: ${{ runner.temp }}/baseline-fingerprint.json
          OTA_REGISTRY_PLUGIN: ${{ runner.temp }}/registry/package/expo-updates-gradle-plugin
        run: node scripts/ota/verify-apk-target.mjs previous-apk/logic-coin.apk be1e5502be784e2f4e398a159851eeb780a9de8a artifacts/compatibility
      - name: Export Android update
        run: node scripts/ota/prepare-export.mjs preview
      - uses: actions/upload-artifact@v4
        with:
          name: logic-coin-tutorial-update
          path: |
            frontend/dist-ota-preview
            artifacts/compatibility
          retention-days: 14
