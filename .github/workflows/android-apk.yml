name: Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Build test APK without lint/tests (not a verified release)'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Check and build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      LOGIC_UPDATE_CHANNEL: production
      NODE_ENV: "production"
      EXPO_PUBLIC_API_URL: https://logic-coin.173.212.216.216.sslip.io/api/v1
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
      EXPO_PUBLIC_APPODEAL_APP_KEY: ${{ secrets.EXPO_PUBLIC_APPODEAL_APP_KEY }}
      EXPO_PUBLIC_APPODEAL_TEST_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.18.0

      - name: Validate production API configuration
        shell: bash
        run: |
          if [[ -z "${EXPO_PUBLIC_API_URL:-}" || "${EXPO_PUBLIC_API_URL}" != https://* ]]; then
            echo "Set the repository variable EXPO_PUBLIC_API_URL to the HTTPS production API URL before building the APK." >&2
            exit 1
          fi
          if [[ -z "${EXPO_PUBLIC_APPODEAL_APP_KEY:-}" ]]; then
            echo "Set the repository secret EXPO_PUBLIC_APPODEAL_APP_KEY before building the Android release." >&2
            exit 1
          fi
          node -e 'const u=new URL(process.env.EXPO_PUBLIC_API_URL); if (u.hostname !== "logic-coin.173.212.216.216.sslip.io" || u.pathname.replace(/\/$/, "") !== "/api/v1") throw Error("APK must use the independent server API"); if (!process.env.EXPO_PUBLIC_GOOGLE_CLIENT_ID?.endsWith(".apps.googleusercontent.com")) throw Error("Missing Google web OAuth client ID");'

      - name: Configure existing Firebase project
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > frontend/google-services.json
          node -e 'const j=require("./frontend/google-services.json"); if(j.private_key || !j.project_info || !j.client?.some(c=>c.client_info?.android_client_info?.package_name === "com.kinddevs.logiccoin")) throw Error("Expected Android Firebase client configuration");'
          echo "GOOGLE_SERVICES_JSON=./google-services.json" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            frontend/app.json
            frontend/plugins/**

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` was removed from current Android SDK repositories. The hosted
          # runner already supplies the command-line tools; only platform-tools
          # needs to be requested explicitly.
          packages: platform-tools

      - name: Install frontend workspace
        run: |
          node scripts/ota/verify-certificate.mjs
          npm ci --workspace frontend --include=dev

      - name: Verify installed SDK dependency compatibility
        working-directory: frontend
        env:
          EXPO_OFFLINE: "1"
        run: npx expo install --check

      - name: Check types and regression tests before Gradle
        if: ${{ !inputs.build_only }}
        run: |
          npm run lint --workspace frontend
          npm run typecheck --workspace frontend
          npm test --workspace frontend

      - name: Verify Android JavaScript bundle
        working-directory: frontend
        run: npx expo export --platform android --output-dir ../artifacts/android-js-check

      - name: Generate native Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Verify independent native update configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('frontend/android/app/src/main')
          ns='{http://schemas.android.com/apk/res/android}'
          app=ET.parse(root/'AndroidManifest.xml').getroot().find('application')
          metadata={m.get(ns+'name'):m.get(ns+'value') for m in app.findall('meta-data')}
          assert metadata['expo.modules.updates.EXPO_UPDATE_URL']=='https://logic-coin.173.212.216.216.sslip.io/updates'
          assert metadata.get('expo.modules.updates.DISABLE_ANTI_BRICKING_MEASURES','false')=='false'
          cfg=json.loads(pathlib.Path('frontend/app.json').read_text())['expo']
          assert cfg['android']['versionCode']==11
          pathlib.Path('artifacts/unsigned').mkdir(parents=True,exist_ok=True)
          (pathlib.Path('artifacts/unsigned')/'native-strings.xml').write_bytes((root/'res/values/strings.xml').read_bytes())
          (pathlib.Path('artifacts/unsigned')/'native-update-config.json').write_text(json.dumps(metadata,indent=2))
          print('Independent update URL, version code 11 and update safety verified.')
          PY

      - name: Build release APK and Play Store bundle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache --no-daemon --stacktrace

      - name: Prepare unsigned Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/unsigned

          release_apk="$(find frontend/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          release_aab="$(find frontend/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          if [ -z "${release_aab}" ]; then
            echo "Release AAB was not produced" >&2
            exit 1
          fi
          cp "${release_apk}" artifacts/unsigned/logic-coin-unsigned.apk
          cp "${release_aab}" artifacts/unsigned/logic-coin-unsigned.aab

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logic-coin-unsigned-android
          path: |
            artifacts/unsigned/logic-coin-unsigned.apk
            artifacts/unsigned/logic-coin-unsigned.aab
            artifacts/unsigned/native-strings.xml
            artifacts/unsigned/native-update-config.json
            artifacts/android-js-check/**
          if-no-files-found: error
          retention-days: 7

  sign-android:
    name: Sign and verify APK and AAB
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Validate signing configuration
        shell: bash
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: logic-coin-unsigned-android
          path: artifacts/unsigned

      - name: Sign Android artifacts and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/signed

          release_apk="artifacts/unsigned/logic-coin-unsigned.apk"
          release_aab="artifacts/unsigned/logic-coin-unsigned.aab"
          if [ ! -f "${release_apk}" ]; then
            echo "Unsigned APK artifact was not downloaded" >&2
            exit 1
          fi
          if [ ! -f "${release_aab}" ]; then
            echo "Unsigned AAB artifact was not downloaded" >&2
            exit 1
          fi

          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "${build_tools}" ]; then
            echo "Android build-tools were not found" >&2
            exit 1
          fi

          keystore="${RUNNER_TEMP}/logic-coin-upload.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"

          "${build_tools}/zipalign" -P 16 -f 4 "${release_apk}" "${RUNNER_TEMP}/logic-coin-aligned.apk"
          "${build_tools}/apksigner" sign \
            --ks "${keystore}" \
            --ks-type PKCS12 \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out artifacts/signed/logic-coin.apk \
            "${RUNNER_TEMP}/logic-coin-aligned.apk"
          "${build_tools}/apksigner" verify --verbose --print-certs artifacts/signed/logic-coin.apk
          "${build_tools}/zipalign" -c -P 16 4 artifacts/signed/logic-coin.apk

          cp "${release_aab}" artifacts/signed/logic-coin.aab
          # Expo's generated release project can leave the Android debug JAR
          # signature in the bundle. Remove every existing top-level signer so
          # the Play Store bundle is signed only by the configured upload key.
          zip -d artifacts/signed/logic-coin.aab \
            'META-INF/*.RSA' \
            'META-INF/*.DSA' \
            'META-INF/*.EC' \
            'META-INF/*.SF' \
            'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          jarsigner \
            -keystore "${keystore}" \
            -storetype PKCS12 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            artifacts/signed/logic-coin.aab \
            "${ANDROID_KEY_ALIAS}"
          jarsigner -verify -verbose -certs artifacts/signed/logic-coin.aab

          aab_signer_count="$(unzip -Z1 artifacts/signed/logic-coin.aab \
            | grep -Ec '^META-INF/[^/]+\.(RSA|DSA|EC)$')"
          if [ "${aab_signer_count}" -ne 1 ]; then
            echo "Expected exactly one AAB signer, found ${aab_signer_count}" >&2
            exit 1
          fi

          cd artifacts/signed
          sha256sum logic-coin.apk > logic-coin.apk.sha256
          sha256sum logic-coin.aab > logic-coin.aab.sha256

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: logic-coin-android-release
          path: |
            artifacts/signed/logic-coin.apk
            artifacts/signed/logic-coin.apk.sha256
            artifacts/signed/logic-coin.aab
            artifacts/signed/logic-coin.aab.sha256
          if-no-files-found: error
          retention-days: 30
