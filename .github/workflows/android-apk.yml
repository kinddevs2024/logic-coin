name: Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Skip broad legacy checks; focused native regressions always run'
        type: boolean
        required: false
        default: false
      reuse_unsigned_release:
        description: 'Sign the exact verified unsigned Android 1.4.5 / 24 build from run 46114589677'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    if: ${{ !inputs.reuse_unsigned_release }}
    name: Check and build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      LOGIC_UPDATE_CHANNEL: production
      NODE_ENV: "production"
      EXPO_PUBLIC_API_URL: https://logic-coin.online/api/v1
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
      EXPO_PUBLIC_APPODEAL_APP_KEY: ${{ secrets.EXPO_PUBLIC_APPODEAL_APP_KEY }}
      EXPO_PUBLIC_APPODEAL_TEST_MODE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.18.0

      - name: Validate production API configuration
        shell: bash
        run: |
          if [[ -z "${EXPO_PUBLIC_API_URL:-}" || "${EXPO_PUBLIC_API_URL}" != https://* ]]; then
            echo "Set the repository variable EXPO_PUBLIC_API_URL to the HTTPS production API URL before building the APK." >&2
            exit 1
          fi
          if [[ -z "${EXPO_PUBLIC_APPODEAL_APP_KEY:-}" ]]; then
            echo "Set the repository secret EXPO_PUBLIC_APPODEAL_APP_KEY before building the Android release." >&2
            exit 1
          fi
          node -e 'const u=new URL(process.env.EXPO_PUBLIC_API_URL); if (u.hostname !== "logic-coin.online" || u.pathname.replace(/\/$/, "") !== "/api/v1") throw Error("APK must use the independent server API"); if (!process.env.EXPO_PUBLIC_GOOGLE_CLIENT_ID?.endsWith(".apps.googleusercontent.com")) throw Error("Missing Google web OAuth client ID");'

      - name: Configure existing Firebase project
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > frontend/google-services.json
          node -e 'const j=require("./frontend/google-services.json"); if(j.private_key || !j.project_info || !j.client?.some(c=>c.client_info?.android_client_info?.package_name === "com.kinddevs.logiccoin")) throw Error("Expected Android Firebase client configuration");'
          echo "GOOGLE_SERVICES_JSON=./google-services.json" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            frontend/app.json
            frontend/plugins/**

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` was removed from current Android SDK repositories. The hosted
          # runner already supplies the command-line tools; only platform-tools
          # needs to be requested explicitly.
          packages: platform-tools

      - name: Restore native task cache across notification build iterations
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: chat-read-native-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: chat-read-native-${{ hashFiles('package-lock.json') }}-

      - name: Install frontend workspace
        run: |
          node scripts/ota/verify-certificate.mjs
          npm ci --workspace frontend --include=dev

      - name: Verify installed SDK dependency compatibility
        working-directory: frontend
        env:
          EXPO_OFFLINE: "1"
        run: npx expo install --check

      - name: Check types and regression tests before Gradle
        if: ${{ !inputs.build_only }}
        run: |
          npm run lint --workspace frontend
          npm run typecheck --workspace frontend
          npm test --workspace frontend

      - name: Verify native notifications, games, and rewarded ads
        run: |
          npm run typecheck --workspace frontend
          cd frontend
          npx eslint src/lib/chat-notification-sync.ts src/lib/chat-notification-sync.web.ts src/lib/notification-payload.ts src/lib/cache-boot.ts src/lib/notifications.ts src/lib/notifications.web.ts src/components/native-data-cache-boundary.tsx src/components/chat/chat-runtime.tsx src/components/chat/conversation-pane.tsx src/app/_layout.tsx src/lib/yandex-rewarded.native.ts src/lib/rewarded-ad-provider.sdk.ts tests/yandex-rewarded-race.test.ts
          npx vitest run tests/chat-notification-read.test.ts tests/chat-notification-native-compat.test.ts tests/notification-open.test.ts tests/yandex-rewarded-race.test.ts tests/light-sequence.test.ts tests/reward-calibration.test.ts tests/bottle-flip.test.ts tests/progress-sync-queue.test.ts

      - name: Verify Android JavaScript bundle
        working-directory: frontend
        run: npx expo export --platform android --output-dir ../artifacts/android-js-check

      - name: Generate native Android project
        working-directory: frontend
        run: npx expo prebuild --platform android --no-install

      - name: Verify independent native update configuration
        run: |
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root=pathlib.Path('frontend/android/app/src/main')
          ns='{http://schemas.android.com/apk/res/android}'
          app=ET.parse(root/'AndroidManifest.xml').getroot().find('application')
          metadata={m.get(ns+'name'):m.get(ns+'value') for m in app.findall('meta-data')}
          assert metadata['expo.modules.updates.EXPO_UPDATE_URL']=='https://logic-coin.online/updates'
          assert metadata.get('expo.modules.updates.DISABLE_ANTI_BRICKING_MEASURES','false')=='false'
          cfg=json.loads(pathlib.Path('frontend/app.json').read_text())['expo']
          assert cfg['version']=='1.4.5' and cfg['android']['versionCode']==24
          assert cfg['android']['package']=='com.kinddevs.logiccoin'
          properties=dict(line.split('=',1) for line in pathlib.Path('frontend/android/gradle.properties').read_text().splitlines() if '=' in line and not line.startswith('#'))
          for key in ('android.enableMinifyInReleaseBuilds','android.enableShrinkResourcesInReleaseBuilds'):
              assert properties[key]=='true', f'{key} must be enabled'
          assert set(properties['reactNativeArchitectures'].split(','))=={'arm64-v8a','armeabi-v7a'}
          java=root/'java/com/kinddevs/logiccoin'
          assert 'add(YandexAdsPackage())' in (java/'MainApplication.kt').read_text()
          assert (java/'YandexAdsModule.java').is_file() and (java/'YandexAdsPackage.java').is_file()
          assert (root/'java/com/kinddevs/logiccoin/chatnotify/ReadFirebaseMessagingService.kt').exists()
          assert any(x.get(ns+'name')=='com.kinddevs.logiccoin.chatnotify.ReadFirebaseMessagingService' for x in app.findall('service'))
          assert any(x.get(ns+'name')=='com.kinddevs.logiccoin.chatnotify.ReadNotificationsReceiver' for x in app.findall('receiver'))
          pathlib.Path('artifacts/unsigned').mkdir(parents=True,exist_ok=True)
          (pathlib.Path('artifacts/unsigned')/'native-strings.xml').write_bytes((root/'res/values/strings.xml').read_bytes())
          (pathlib.Path('artifacts/unsigned')/'native-update-config.json').write_text(json.dumps(metadata,indent=2))
          print('Independent update URL, Android 1.4.5 / 24, both ARM ABIs, R8 and resource shrinking verified.')
          PY

      - name: Test native notification cancellation and delivery ordering
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testReleaseUnitTest --tests 'com.kinddevs.logiccoin.chatnotify.ChatReadStateTest' -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache --no-daemon --stacktrace

      - name: Upload native notification test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-read-native-test-results
          path: |
            frontend/android/app/build/test-results/testReleaseUnitTest/
            frontend/android/app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build release APK and Play Store bundle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency com.yandex.android:mobileads --no-daemon | tee ../../artifacts/unsigned/yandex-sdk-dependencies.txt
          grep -q 'com.yandex.android:mobileads:8.6.0' ../../artifacts/unsigned/yandex-sdk-dependencies.txt
          ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache --no-daemon --stacktrace

      - name: Prepare unsigned Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/unsigned

          release_apk="$(find frontend/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          release_aab="$(find frontend/android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          if [ -z "${release_apk}" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          if [ -z "${release_aab}" ]; then
            echo "Release AAB was not produced" >&2
            exit 1
          fi
          cp "${release_apk}" artifacts/unsigned/logic-coin-unsigned.apk
          cp "${release_aab}" artifacts/unsigned/logic-coin-unsigned.aab
          mapping=frontend/android/app/build/outputs/mapping/release/mapping.txt
          test -s "$mapping"
          cp "$mapping" artifacts/unsigned/r8-mapping.txt

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logic-coin-unsigned-android
          path: |
            artifacts/unsigned/logic-coin-unsigned.apk
            artifacts/unsigned/logic-coin-unsigned.aab
            artifacts/unsigned/native-strings.xml
            artifacts/unsigned/native-update-config.json
            artifacts/unsigned/yandex-sdk-dependencies.txt
            artifacts/unsigned/r8-mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload matching OTA export
        uses: actions/upload-artifact@v4
        with:
          name: independent-apk-ota-export
          path: artifacts/android-js-check/
          if-no-files-found: error
          retention-days: 14

      - name: Save native task cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: chat-read-native-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}

  sign-android:
    name: Sign and verify APK and AAB
    needs: build-android
    if: ${{ always() && !cancelled() && (needs.build-android.result == 'success' || (inputs.reuse_unsigned_release && needs.build-android.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout release verification script
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate signing configuration
        shell: bash
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Download unsigned Android artifacts
        if: ${{ !inputs.reuse_unsigned_release }}
        uses: actions/download-artifact@v4
        with:
          name: logic-coin-unsigned-android
          path: artifacts/unsigned

      - name: Recover the exact successful unsigned build
        if: ${{ inputs.reuse_unsigned_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/android-release-1-4-5-20261128
          built_sha=1fbeb784d8154dbc3f40717741f9a7aa0a5d1f38
          run=46114589677
          git diff --exit-code "$built_sha" "$GITHUB_SHA" -- . ':(exclude).github/workflows/android-apk.yml'
          api="repos/$GITHUB_REPOSITORY/actions/runs/$run"
          gh api "$api" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$built_sha" '
            .status == "completed" and .path == ".github/workflows/android-apk.yml"
            and .head_repository.full_name == $repo and .head_sha == $sha'
          gh api "$api/jobs" | jq -e '[.jobs[] | select(.name=="Check and build APK and AAB" and .conclusion=="success")] | length == 1'
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name logic-coin-unsigned-android --dir artifacts/unsigned

      - name: Sign Android artifacts and create checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/signed

          release_apk="artifacts/unsigned/logic-coin-unsigned.apk"
          release_aab="artifacts/unsigned/logic-coin-unsigned.aab"
          if [ ! -f "${release_apk}" ]; then
            echo "Unsigned APK artifact was not downloaded" >&2
            exit 1
          fi
          if [ ! -f "${release_aab}" ]; then
            echo "Unsigned AAB artifact was not downloaded" >&2
            exit 1
          fi

          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "${build_tools}" ]; then
            echo "Android build-tools were not found" >&2
            exit 1
          fi

          keystore="${RUNNER_TEMP}/logic-coin-upload.p12"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"

          "${build_tools}/zipalign" -P 16 -f 4 "${release_apk}" "${RUNNER_TEMP}/logic-coin-aligned.apk"
          "${build_tools}/apksigner" sign \
            --ks "${keystore}" \
            --ks-type PKCS12 \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out artifacts/signed/logic-coin.apk \
            "${RUNNER_TEMP}/logic-coin-aligned.apk"
          "${build_tools}/apksigner" verify --verbose --print-certs artifacts/signed/logic-coin.apk | tee artifacts/signed/apk-certificate.txt
          grep -qx 'Number of signers: 1' artifacts/signed/apk-certificate.txt
          signer="$(awk -F': ' '/ certificate SHA-256 digest:/ {print toupper($2)}' artifacts/signed/apk-certificate.txt | sort -u)"
          test "$signer" = '85DA6343AA98CDDB89A8090DADFFF7525441BA5CD97503E429F5074FD16E3822'
          "${build_tools}/aapt2" dump badging artifacts/signed/logic-coin.apk > artifacts/signed/apk-badging.txt
          grep -Eq "^package: name='com[.]kinddevs[.]logiccoin' versionCode='24' versionName='1[.]4[.]5'" artifacts/signed/apk-badging.txt
          python3 scripts/android-release-proof.py artifacts/signed/logic-coin.apk artifacts/unsigned/r8-mapping.txt > artifacts/signed/android-native-proof.json
          "${build_tools}/zipalign" -c -P 16 4 artifacts/signed/logic-coin.apk

          cp "${release_aab}" artifacts/signed/logic-coin.aab
          # Expo's generated release project can leave the Android debug JAR
          # signature in the bundle. Remove every existing top-level signer so
          # the Play Store bundle is signed only by the configured upload key.
          zip -d artifacts/signed/logic-coin.aab \
            'META-INF/*.RSA' \
            'META-INF/*.DSA' \
            'META-INF/*.EC' \
            'META-INF/*.SF' \
            'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
          jarsigner \
            -keystore "${keystore}" \
            -storetype PKCS12 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            artifacts/signed/logic-coin.aab \
            "${ANDROID_KEY_ALIAS}"
          jarsigner -verify -verbose -certs artifacts/signed/logic-coin.aab

          aab_signer_count="$(unzip -Z1 artifacts/signed/logic-coin.aab \
            | grep -Ec '^META-INF/[^/]+\.(RSA|DSA|EC)$')"
          if [ "${aab_signer_count}" -ne 1 ]; then
            echo "Expected exactly one AAB signer, found ${aab_signer_count}" >&2
            exit 1
          fi

          cd artifacts/signed
          sha256sum logic-coin.apk > logic-coin.apk.sha256
          sha256sum logic-coin.aab > logic-coin.aab.sha256

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: logic-coin-android-release
          path: |
            artifacts/signed/logic-coin.apk
            artifacts/signed/logic-coin.apk.sha256
            artifacts/signed/logic-coin.aab
            artifacts/signed/logic-coin.aab.sha256
            artifacts/signed/android-native-proof.json
            artifacts/signed/apk-certificate.txt
            artifacts/signed/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
