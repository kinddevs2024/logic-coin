name: Raffle website release preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_ENV: production
      LOGIC_UPDATE_CHANNEL: production
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://logic-coin.173.212.216.216.sslip.io/api/v1
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB: ${{ vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB || secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID_WEB }}
      EXPO_PUBLIC_APPODEAL_APP_KEY: ${{ secrets.EXPO_PUBLIC_APPODEAL_APP_KEY }}
      EXPO_PUBLIC_APPODEAL_TEST_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@11.18.0
      - run: npm ci --include=dev
      - run: npm run typecheck --workspace backend && npm run typecheck --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm test --workspace backend && npm test --workspace frontend
      - run: npm run build --workspace backend
      - run: npm run build:web --workspace frontend
      - uses: actions/upload-artifact@v4
        with:
          name: raffle-release
          path: |
            backend/dist
            frontend/dist
          if-no-files-found: error
          retention-days: 14
