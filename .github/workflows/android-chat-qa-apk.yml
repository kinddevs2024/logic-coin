name: Android chat QA APK

on:
  push:
    branches: [codex/chat-qa-apk-20261121]
    paths: ['.github/workflows/android-chat-qa-apk.yml', 'scripts/ota/retarget-chat-qa-apk.py']

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: logic-coin-android-release
          run-id: 43686715747
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
      - name: Verify baseline, retarget and sign QA APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          expected="85da6343aa98cddb89a8090dadfff7525441ba5cd97503e429f5074fd16e3822"
          "$tools/apksigner" verify --print-certs baseline/logic-coin.apk | grep -F "$expected"
          python3 scripts/ota/retarget-chat-qa-apk.py baseline/logic-coin.apk "$RUNNER_TEMP/unsigned.apk"
          "$tools/zipalign" -P 16 -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          mkdir output
          umask 077
          keystore="$RUNNER_TEMP/qa-keystore.p12"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out output/logic-coin-chat-qa.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs output/logic-coin-chat-qa.apk | grep -F "$expected"
          "$tools/zipalign" -c -P 16 4 output/logic-coin-chat-qa.apk
          "$tools/aapt" dump badging output/logic-coin-chat-qa.apk > "$RUNNER_TEMP/badging.txt"
          "$tools/aapt" dump xmltree output/logic-coin-chat-qa.apk AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -F "name='com.kinddevs.logiccoin' versionCode='22' versionName='1.4.3'" "$RUNNER_TEMP/badging.txt"
          grep -F chatheadqa "$RUNNER_TEMP/manifest.txt"
          cd output
          sha256sum logic-coin-chat-qa.apk > logic-coin-chat-qa.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: logic-coin-chat-qa
          path: output/
          if-no-files-found: error
          retention-days: 3
